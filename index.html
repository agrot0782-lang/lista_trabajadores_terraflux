<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Actualizar Bases Firebase</title>

<!-- XLSX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

body{

    font-family:Arial, sans-serif;

    background:#f3f4f6;

    padding:40px;

}

.box{

    background:white;

    max-width:700px;

    margin:auto auto 30px auto;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0 4px 20px rgba(0,0,0,0.08);

}

h2{

    margin-top:0;

    margin-bottom:24px;

    color:#111827;

}

input{

    width:100%;

    margin-bottom:20px;

}

button{

    width:100%;

    border:none;

    background:#2563eb;

    color:white;

    padding:14px;

    border-radius:14px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.2s;

}

button:hover{

    transform:translateY(-2px);

    background:#1d4ed8;

}

.status{

    margin-top:20px;

    font-size:14px;

    color:#374151;

}

</style>

</head>

<body>

<!-- 🔥 TRABAJADORES -->

<div class="box">

    <h2>
        🔥 Actualizar Base de Trabajadores
    </h2>

    <input
    type="file"
    id="excelTrabajadores">

    <button onclick="actualizarBase()">
        Actualizar Trabajadores
    </button>

    <div
    class="status"
    id="statusTrabajadores">

        Esperando Excel...

    </div>

</div>

<!-- 🔥 AREAS -->

<div class="box">

    <h2>
        🔥 Actualizar Base de Areas
    </h2>

    <input
    type="file"
    id="excelAreas">

    <button onclick="importarAreas()">
        Actualizar Areas
    </button>

    <div
    class="status"
    id="statusAreas">

        Esperando Excel...

    </div>

</div>
<div class="box">

    <h2>
        🔥 Actualizar Tareo
    </h2>

    <input
    type="file"
    id="excelTareo">

    <button onclick="importarTareo()">
        Actualizar Tareo
    </button>

    <div
    class="status"
    id="statusTareo">

        Esperando Excel...

    </div>

</div>
<div class="box">

    <h2>
        🔥 Actualizar Terrapuerto
    </h2>

    <input
    type="file"
    id="excelTerrapuerto">

    <button onclick="importarTerrapuerto()">
        Actualizar Terrapuerto
    </button>

    <div
    class="status"
    id="statusTerrapuerto">

        Esperando Excel...

    </div>

</div>

<script>

// 🔥 FIREBASE
var firebaseConfig = {

    apiKey: "AIzaSyDz4RqKjSJxB0F5eP4RzajQtW94cPXmpSg",

    authDomain: "data-b6691.firebaseapp.com",

    projectId: "data-b6691",

    storageBucket: "data-b6691.firebasestorage.app",

    messagingSenderId: "932857865624",

    appId: "1:932857865624:web:20408d56e0a821aae737ed",

    measurementId: "G-G16TH0Y127"

};

firebase.initializeApp(firebaseConfig);

var db = firebase.database();

// 🔥 ARRAYS
let datosTrabajadores = [];
let datosAreas = [];
let datosTareo = [];
let datosTerrapuerto = [];



// ======================================================
// 🔥 CARGAR EXCEL TERRAPUERTO
// ======================================================
document
.getElementById("excelTerrapuerto")
.addEventListener("change", function(e){

    const file = e.target.files[0];

    const reader = new FileReader();

    reader.onload = function(e){

        const data =
        new Uint8Array(e.target.result);

        const workbook =
        XLSX.read(data,{
            type:'array'
        });

        const sheet =
        workbook.Sheets[
            workbook.SheetNames[0]
        ];

        datosTerrapuerto =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                range:2
            }
        );

        console.log(datosTerrapuerto);

        document
        .getElementById(
            "statusTerrapuerto"
        )
        .innerText =
        "✅ Excel Terrapuerto cargado";

    };

    reader.readAsArrayBuffer(file);

});

// ======================================================
// 🔥 CARGAR EXCEL TRABAJADORES
// ======================================================

document
.getElementById("excelTrabajadores")
.addEventListener("change", function(e){

    const file = e.target.files[0];

    const reader = new FileReader();

    reader.onload = function(e){

        const data =
        new Uint8Array(e.target.result);

        const workbook =
        XLSX.read(data,{
            type:'array'
        });

        const sheet =
        workbook.Sheets[
            workbook.SheetNames[0]
        ];

        datosTrabajadores =
        XLSX.utils.sheet_to_json(sheet,{

            range:2

        });

        console.log(datosTrabajadores);

        document
        .getElementById("statusTrabajadores")
        .innerText =
        "✅ Excel cargado correctamente";

    };

    reader.readAsArrayBuffer(file);

});


// ======================================================
// 🔥 ACTUALIZAR TRABAJADORES
// ======================================================

function actualizarBase(){

    if(datosTrabajadores.length === 0){

        alert(
            "⚠️ Primero carga un Excel"
        );

        return;

    }

    if(!confirm(
        "⚠️ Esto borrará la base actual y cargará la nueva. ¿Continuar?"
    )){

        return;

    }

    db.ref("trabajadores")
    .remove()

    .then(()=>{

        console.log(
            "🔥 Base eliminada"
        );

        datosTrabajadores.forEach(trabajador => {

            let LEGAJO =
            trabajador["LEGAJO"];

            if(!LEGAJO) return;

            db.ref(
                "trabajadores/" + LEGAJO
            ).set({

                nombre:
                trabajador["NOMBRES"] || "",

                apellido_paterno:
                trabajador["APELLIDO PATERNO"] || "",

                apellido_materno:
                trabajador["APELLIDO MATERNO"] || "",

                sexo:
                trabajador["SEXO"] || "",

                fecha_ingreso:
                trabajador["FECHA INGRESO"] || "",

                fecha_reingreso:
                trabajador["FECHA REINGRESO"] || "",

                fecha_cese:
                trabajador["FECHA CESE"] || "",

                motivo_cese:
                trabajador["MOTIVO CESE"] || "",

                observaciones:
                trabajador["OBSERVACIONES"] || "",

                zona:
                trabajador["ZONA PROCEDENCIA"] || "",

                estado:
                trabajador["ESTADO"] || ""

            });

        });

        alert(
            "🔥 Base actualizada correctamente"
        );

        document
        .getElementById("statusTrabajadores")
        .innerText =
        "🔥 Base actualizada correctamente";

    })

    .catch(error => {

        console.error(error);

        alert(
            "❌ Error al actualizar"
        );

    });

}


// ======================================================
// 🔥 CARGAR EXCEL AREAS
// ======================================================

document
.getElementById("excelAreas")
.addEventListener("change", function(e){

    const file = e.target.files[0];

    const reader = new FileReader();

    reader.onload = function(e){

        const data =
        new Uint8Array(e.target.result);

        const workbook =
        XLSX.read(data,{
            type:'array'
        });

        const sheet =
        workbook.Sheets[
            workbook.SheetNames[0]
        ];

        datosAreas =
        XLSX.utils.sheet_to_json(sheet,{

            range:2

        });

        console.log(datosAreas);

        document
        .getElementById("statusAreas")
        .innerText =
        "✅ Excel de Areas cargado";

    };

    reader.readAsArrayBuffer(file);

});

// ======================================================
// 🔥 CARGAR TAREO
// ======================================================

document
.getElementById("excelTareo")
.addEventListener("change", function(e){

    const file = e.target.files[0];

    const reader = new FileReader();

    reader.onload = function(e){

        const data =
        new Uint8Array(e.target.result);

        const workbook =
        XLSX.read(data,{

        });

        const sheet =
        workbook.Sheets[
            workbook.SheetNames[0]
        ];

        datosTareo =
        XLSX.utils.sheet_to_json(sheet,{
            range:2
        });

        console.log(datosTareo);

        document
        .getElementById("statusTareo")
        .innerText =
        "✅ Excel de Tareo cargado";

    };

    reader.readAsArrayBuffer(file);

});


// ======================================================
// 🔥 IMPORTAR AREAS
// ======================================================

function importarAreas(){

    if(datosAreas.length === 0){

        alert("⚠️ Primero carga un Excel");

        return;

    }

    if(!confirm(
        "⚠️ Esto actualizará la base de areas. ¿Continuar?"
    )){

        return;

    }

    db.ref("areas")
    .remove()

    .then(()=>{

        let updates = {};

        datosAreas.forEach(row => {

            let legajo =
            String(row["LEGAJO"] || "")
            .trim();

            if(!legajo) return;

            updates[
                "areas/" + legajo
            ] = {

                legajo: legajo,

                trabajador:
                row["TRABAJADOR"] || "",

                actividad:
                row["ACTIVIDAD"] || "",

                supervisor:
                row["SUPERVISOR"] || "",

                grupo:
                row["GRUPO"] || "",

                empresa:
                row["EMPRESA"] || "",

                centro_costo:
                row["CENTRO DE COSTO"] || "",

                sexo:
                row["SEXO"] || "",

                procedencia:
                row["PROCEDENCIA"] || "",

                residencia:
                row["RESIDENCIA"] || "",

                fecha:
                row["FECHA"] || "",

                estado:
                row["ESTADO REG."] || ""

            };

        });

        db.ref()
        .update(updates)

        .then(()=>{

            alert(
                "✅ Areas importadas correctamente"
            );

            document
            .getElementById("statusAreas")
            .innerText =
            "✅ Base de Areas actualizada";

        })

        .catch(error => {

            console.log(error);

            alert(
                "❌ Error importando areas"
            );

        });

    });

}

    if(datosTareo.length === 0){

            let legajo =
            String(row["LEGAJO"] || "")

            if(!legajo) return;

            updates[
                "tareo/" + legajo
            ] = {

                legajo: legajo,

                trabajador:
                row["TRABAJADOR"] || "",

                supervisor:
                row["SUPERVISOR"] || "",

                grupo:
                row["GRUPO"] || "",

                actividad:
                row["ACTIVIDAD"] || "",

                centro_costo:
                row["CENTRO DE COSTO"] || "",

                planilla:
                row["PLANILLA"] || "",

                hora_inicio:
                row["H. INICIO"] || "",

                hora_fin:
                row["H. FIN"] || "",

                estado:
                row["ESTADO REG."] || "",

                fecha:
                row["FECHA"] || "",

                procedencia:
                row["PROCEDENCIA"] || "",

                residencia:
                row["RESIDENCIA"] || ""

            };

        });

        db.ref()
        .update(updates)

        .then(()=>{

            alert(
                "✅ Tareo importada correctamente"
            );

            document
            .getElementById("statusTareo")
            .innerText =
            "✅ Base de Tareo actualizada";

        })

        .catch(error => {

            console.log(error);

            alert(
                "❌ Error importando tareo"
            );

        });

    });

}
function importarTerrapuerto(){

    if(datosTerrapuerto.length === 0){

        alert(
            "⚠️ Primero carga el Excel"
        );

        return;

    }

    if(!confirm(
        "⚠️ Esto actualizará Terrapuerto. ¿Continuar?"
    )){

        return;

    }

    db.ref("terrapuerto")
    .remove()

    .then(()=>{

        let updates = {};

        datosTerrapuerto.forEach(row => {

            let legajo =
            String(
                row["LEGAJO"] || ""
            ).trim();

            if(!legajo) return;

            updates[
                "terrapuerto/" + legajo
            ] = {

                legajo: legajo,

                nombres:
                row["NOMBRES"] || "",

                ap_paterno:
                row["AP.PATERNO"] || "",

                ap_materno:
                row["AP.MATERNO"] || "",

                cuadrilla:
                row["CUADRILLA"] || "",

                fecha:
                row["FECHA"] || "",

                hora_marcado:
                row["HORA MARCADO"] || "",

                planilla:
                row["PLANILLA"] || "",

                cargo:
                row["CARGO"] || "",

                 fundo:
                 row["FUNDO"] || ""
            };

        });

        db.ref()
        .update(updates)

        .then(()=>{

            alert(
                "✅ Terrapuerto actualizado"
            );

            document
            .getElementById(
                "statusTerrapuerto"
            )
            .innerText =
            "✅ Base Terrapuerto actualizada";

        })

        .catch(error => {

            alert(

            );

}
</script>

</body>
</html>
